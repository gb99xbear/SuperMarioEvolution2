<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Mario Evolution 2 - Power-Ups & Refined 1-1</title>
  <style>
    body {
      margin: 0;
      background: #151515;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #fff;
    }
    canvas {
      border: 3px solid #444;
      background: #5c94fc;
      image-rendering: pixelated;
    }
    .hud {
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>

<div class="hud">
  <span>STATUS: <b id="ui-state">SMALL</b></span>
  NYAWA: <b id="ui-lives">3</b>
  <span>SCORE: <b id="ui-score">00000</b></span>
  <span>STAR: <b id="ui-star">OFF</b></span>
</div>
<canvas id="game" width="256" height="240"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const bgImage = new Image();
bgImage.src = "assets/platformer-mountains.png";
let audioCtx = null;
function sound(freq, duration = 0.08, type = "square") {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.value = 0.045;
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  } catch (_) {}
}
function musicTick() { sound(196, 0.04, "triangle"); }

canvas.style.width = "768px";
canvas.style.height = "720px";

const TILE_SIZE = 16;
const GRAVITY = 0.28;

const keys = {};
window.addEventListener("keydown", e => {
  if (e.code === "KeyZ" || e.code === "KeyJ") shootFireball();
  keys[e.code] = true;
});
window.addEventListener("keyup", e => keys[e.code] = false);

// Peta dibaiki: Tiada paip melebihi 3 blok, lubang maksimum 2 blok (boleh lompat terus)
let rawMap = [
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "..................................................................................L.................",
  "....................#M#.......................#S#.................................L.......####......",
  ".............................F....................................................L.......#..#......",
  "...........................####...........................................#.......L.......#..#......",
  "..................P........####.........P...............P................##.......L.......#..#......",
  "###################..####################..##############..################..#######################",
  "###################..####################..##############..################..#######################"
].map(row => row.split(''));

const mapWidth = rawMap[0].length;
const mapHeight = rawMap.length;

let score = 0;
let lives = 3;
let stageIndex = 0;
const STAGES = [
  { name: "Kampung Pagi", start: 24, flag: 70 },
  { name: "Sawah Kelantan", start: 24, flag: 84 },
  { name: "Rimba Tok Bali", start: 24, flag: 96 }
];
let cameraX = 0;
let win = false;
let gameOver = false;
let stageClearTimer = 0;

// 0: Small, 1: Super, 2: Fire
const mario = {
  x: 24,
  y: 160,
  vx: 0,
  vy: 0,
  w: 12,
  h: 15,
  state: 0,
  grounded: false,
  dead: false,
  starTimer: 0,
  invulnerableTimer: 0
};

const items = [];
const fireballs = [];
const enemies = [
  { x: 180, y: 190, vx: -0.5, w: 14, h: 14, alive: true },
  { x: 360, y: 190, vx: -0.5, w: 14, h: 14, alive: true },
  { x: 620, y: 190, vx: -0.5, w: 14, h: 14, alive: true },
  { x: 800, y: 190, vx: -0.5, w: 14, h: 14, alive: true }
];

function getTile(tx, ty) {
  if (tx < 0 || tx >= mapWidth || ty < 0 || ty >= mapHeight) return '.';
  return rawMap[ty][tx];
}

function isSolid(tile) {
  return tile === '#' || tile === 'P' || tile === 'M' || tile === 'F' || tile === 'S';
}

function checkTileCollision(x, y, w, h) {
  const sx = Math.floor(x / TILE_SIZE);
  const ex = Math.floor((x + w - 0.1) / TILE_SIZE);
  const sy = Math.floor(y / TILE_SIZE);
  const ey = Math.floor((y + h - 0.1) / TILE_SIZE);

  for (let ty = sy; ty <= ey; ty++) {
    for (let tx = sx; tx <= ex; tx++) {
      if (isSolid(getTile(tx, ty))) {
        return { hit: true, tx, ty, tile: getTile(tx, ty) };
      }
    }
  }
  return { hit: false };
}

function triggerBlock(tx, ty, tile) {
  if (tile === 'M' || tile === 'F' || tile === 'S') {
    rawMap[ty][tx] = '#';
    items.push({
      type: tile,
      x: tx * TILE_SIZE,
      y: (ty - 1) * TILE_SIZE,
      vx: tile === 'F' ? 0 : 1,
      vy: tile === 'S' ? -3 : -1,
      w: 12,
      h: 12,
      grounded: false
    });
  }
}

function shootFireball() {
  if (mario.state !== 2 || mario.dead || fireballs.length >= 2) return;
  fireballs.push({
    x: mario.x + (mario.vx >= 0 ? mario.w : -8),
    y: mario.y + 4,
    vx: mario.vx >= 0 ? 3.5 : -3.5,
    vy: 1,
    w: 6,
    h: 6
  });
}

function damageMario() {
  if (mario.starTimer > 0 || mario.invulnerableTimer > 0) return;
  if (mario.state > 0) {
    // Super/Fire Mario → becomes Small with i-frames, don't lose life
    mario.state = 0;
    mario.h = 15;
    mario.y -= 7;
    mario.invulnerableTimer = 120;
  } else {
    // Small Mario → lose a life
    loseLife();
  }
}

function resetStage() {
  mario.x = STAGES[stageIndex].start; mario.y = 160; mario.vx = 0; mario.vy = 0;
  mario.dead = false; mario.state = 0; mario.h = 15; mario.starTimer = 0; mario.invulnerableTimer = 0;
  cameraX = 0; win = false;
  enemies.forEach((e, i) => { e.alive = true; e.x = 180 + i * 180 + stageIndex * 24; e.vx = i % 2 ? 0.5 : -0.5; });
}
function loseLife() {
  if (mario.dead || win || gameOver) return;
  lives--;
  sound(110, 0.18, "sawtooth");
  if (lives <= 0) { gameOver = true; mario.dead = true; return; }
  mario.dead = true;
  setTimeout(() => { resetStage(); mario.invulnerableTimer = 120; }, 700);
}
function advanceStage() {
  sound(784, 0.12, "square");
  stageIndex++;
  if (stageIndex >= STAGES.length) { win = true; sound(988, 0.25, "triangle"); return; }
  stageClearTimer = 45;
  resetStage();
}

function resetGame() {
  score = 0; lives = 3; stageIndex = 0; gameOver = false; win = false;
  resetStage();
  musicTick();
}

function update() {
  if (mario.dead || win || gameOver) return;

  if (mario.starTimer > 0) mario.starTimer--;
  if (mario.invulnerableTimer > 0) mario.invulnerableTimer--;

  if (keys["ArrowRight"] || keys["KeyD"]) mario.vx += 0.15;
  else if (keys["ArrowLeft"] || keys["KeyA"]) mario.vx -= 0.15;
  else mario.vx *= 0.82;

  const maxSpeed = keys["ShiftLeft"] ? 2.5 : 1.8;
  mario.vx = Math.max(Math.min(mario.vx, maxSpeed), -maxSpeed);

  if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && mario.grounded) {
    mario.vy = -6.2;
    mario.grounded = false;
  }

  mario.vy += GRAVITY;
  if (mario.vy > 7) mario.vy = 7;

  mario.x += mario.vx;
  let colX = checkTileCollision(mario.x, mario.y, mario.w, mario.h);
  if (colX.hit) {
    mario.x -= mario.vx;
    mario.vx = 0;
  }

  mario.y += mario.vy;
  mario.grounded = false;
  let colY = checkTileCollision(mario.x, mario.y, mario.w, mario.h);
  if (colY.hit) {
    if (mario.vy > 0) {
      mario.grounded = true;
    } else if (mario.vy < 0) {
      triggerBlock(colY.tx, colY.ty, colY.tile);
    }
    mario.y -= mario.vy;
    mario.vy = 0;
  }

  function loseLife() {
  if (lives > 1) { lives--; resetStage(); } 
  else { gameOver = true; setTimeout(() => { alert("GAME OVER\nSCORE: " + score); location.reload(); }, 2000); }
}

  const currentTileX = Math.floor((mario.x + mario.w / 2) / TILE_SIZE);
  const currentTileY = Math.floor((mario.y + mario.h / 2) / TILE_SIZE);
  if (getTile(currentTileX, currentTileY) === 'L') advanceStage();

  if (mario.x - cameraX > 110) cameraX = mario.x - 110;
  if (mario.x < cameraX) mario.x = cameraX;

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.vy += GRAVITY;
    it.x += it.vx;
    if (checkTileCollision(it.x, it.y, it.w, it.h).hit) it.vx *= -1;

    it.y += it.vy;
    const itColY = checkTileCollision(it.x, it.y, it.w, it.h);
    if (itColY.hit) {
      it.y -= it.vy;
      if (it.type === 'S') it.vy = -3.5;
      else { it.vy = 0; it.grounded = true; }
    }
    if (mario.x < it.x + it.w && mario.x + mario.w > it.x &&
        mario.y < it.y + it.h && mario.y + mario.h > it.y) {
      if (it.type === 'M') {
        if (mario.state === 0) { mario.state = 1; mario.y -= 7; mario.h = 22; }
      } else if (it.type === 'F') {
        mario.state = 2;
        if (mario.h === 15) { mario.y -= 7; mario.h = 22; }
      } else if (it.type === 'S') {
        mario.starTimer = 600;
      }
      score += 1000;
      items.splice(i, 1);
    }
  }

  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.y += fb.vy;
    fb.vy += GRAVITY;

    if (checkTileCollision(fb.x, fb.y, fb.w, fb.h).hit) {
      fb.vy = -2.8;
    }

    if (fb.x > cameraX + 270 || fb.x < cameraX - 20 || fb.y > 240) {
      fireballs.splice(i, 1);
      continue;
    }

    let hit = false;
    enemies.forEach(e => {
      if (!hit && e.alive && fb.x < e.x + e.w && fb.x + fb.w > e.x && fb.y < e.y + e.h && fb.y + fb.h > e.y) {
        e.alive = false;
        hit = true;
        score += 200;
      }
    });
    if (hit) { fireballs.splice(i, 1); }
  }

  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    if (checkTileCollision(e.x, e.y, e.w, e.h).hit) e.vx *= -1;

    if (mario.x < e.x + e.w && mario.x + mario.w > e.x &&
        mario.y < e.y + e.h && mario.y + mario.h > e.y) {
      if (mario.starTimer > 0) {
        e.alive = false;
        score += 200;
      } else if (mario.vy > 0 && mario.y + mario.h - e.y < 8) {
        e.alive = false;
        mario.vy = -3.8;
        score += 100;
      } else {
        damageMario();
      }
    }
  });

  const stateNames = ["SMALL", "SUPER", "FIRE"];
  document.getElementById("ui-state").innerText = stateNames[mario.state];
  document.getElementById("ui-score").innerText = String(score).padStart(5, '0');
  document.getElementById("ui-star").innerText = mario.starTimer > 0 ? (Math.ceil(mario.starTimer/60) + "s") : "OFF";
}

// Native-resolution pixel-art sprites: layered silhouettes, highlights and outlines.
function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, w), Math.max(1, h)); }

function drawGoomba(x, y, w, h, facingLeft) {
  x = Math.round(x); y = Math.round(y + Math.sin(performance.now() / 180));
  // dark outline / mushroom silhouette
  px(x + 1, y + 5, w - 2, h - 5, '#351812');
  px(x + 2, y + 3, w - 4, 8, '#6e2b18');
  px(x + 4, y + 2, w - 8, 2, '#a94a20');
  px(x + 2, y + 7, w - 4, 5, '#9b3d1d');
  // angry brows and eyes
  px(x + 3, y + 5, 4, 2, '#24100d'); px(x + w - 7, y + 5, 4, 2, '#24100d');
  px(x + 4, y + 7, 3, 3, '#fff4cf'); px(x + w - 7, y + 7, 3, 3, '#fff4cf');
  px(x + (facingLeft ? 4 : 5), y + 7, 2, 3, '#111');
  px(x + w - (facingLeft ? 5 : 6), y + 7, 2, 3, '#111');
  // feet and sole highlights
  px(x - 1, y + h - 3, 7, 3, '#3b1712'); px(x + w - 6, y + h - 3, 7, 3, '#3b1712');
  px(x + 1, y + h - 1, 5, 1, '#d47a35'); px(x + w - 5, y + h - 1, 5, 1, '#d47a35');
}

function drawMario(x, y, w, h, facing, state, star, dead) {
  x = Math.round(x); y = Math.round(y);
  const rainbow = ['#ffe600', '#ff3b30', '#36d15c', '#3b82f6'];
  const cap = star ? rainbow[Math.floor(performance.now() / 90) % rainbow.length] : '#e3262e';
  const shirt = star ? rainbow[Math.floor(performance.now() / 90) % rainbow.length] : (state === 2 ? '#fff' : '#e3262e');
  const outline = dead ? '#555' : '#27151b';
  const skin = '#f5a15b', skinHi = '#ffd08b', blue = '#2450d0', darkBlue = '#142b86';
  const headH = h >= 20 ? 9 : 7;
  const bodyY = y + headH + 2;
  // outline silhouette
  px(x + 1, y + 2, w - 2, h - 3, outline);
  // cap and brim
  px(x + 2, y, w - 4, 3, cap); px(x, y + 2, w - 1, 2, cap); px(x + 3, y + 1, w - 6, 1, '#ff6868');
  // face with ear/nose silhouette
  px(x + 3, y + 4, w - 6, headH - 2, skin);
  px(x + 4, y + 4, w - 8, 2, skinHi);
  px(facing < 0 ? x + 1 : x + w - 4, y + 6, 3, 3, skin);
  // hair, eye and moustache
  px(x + (facing < 0 ? w - 6 : 3), y + 4, 3, 3, '#4a2519');
  px(x + (facing < 0 ? 4 : w - 6), y + 6, 2, 2, '#111');
  px(x + (facing < 0 ? 2 : w - 7), y + 9, 6, 2, '#4a2519');
  // shirt, overalls bib and straps
  px(x + 2, bodyY, w - 4, Math.max(3, h - (bodyY - y) - 3), shirt);
  px(x + 3, bodyY + 2, w - 6, Math.max(3, h - (bodyY - y) - 5), blue);
  px(x + 4, bodyY + 1, 2, 5, darkBlue); px(x + w - 6, bodyY + 1, 2, 5, darkBlue);
  // hands and shoes
  px(facing < 0 ? x : x + w - 3, bodyY + 1, 3, 5, skinHi);
  px(x, y + h - 3, 6, 3, '#6a351e'); px(x + w - 6, y + h - 3, 6, 3, '#6a351e');
  px(x + 1, y + h - 1, 5, 1, '#c27438'); px(x + w - 5, y + h - 1, 5, 1, '#c27438');
}

function drawPowerItem(it) {
  const x = Math.round(it.x), y = Math.round(it.y), w = it.w, h = it.h;
  if (it.type === 'M') {
    px(x + 1, y + 2, w - 2, h - 2, '#351812'); px(x + 2, y + 1, w - 4, 7, '#e3262e');
    px(x + 3, y + 4, 3, 3, '#fff'); px(x + w - 6, y + 4, 3, 3, '#fff'); px(x + 3, y + 8, w - 6, h - 8, '#f5a15b');
  } else if (it.type === 'F') {
    px(x + 5, y + 5, 2, h - 4, '#239447'); px(x + 2, y + 2, 5, 6, '#ff5c87'); px(x + 6, y + 1, 5, 6, '#ffe45c'); px(x + 4, y + 5, 4, 4, '#fff');
  } else {
    px(x + 5, y, 3, h, '#fff'); px(x + 1, y + 4, 11, 4, '#ffe600'); px(x + 3, y + 2, 7, 8, '#ffe600'); px(x + 2, y + 5, 9, 3, '#ff4d6d');
  }
}

function drawBrickTile(x, y, topGround = false) {
  // Warm red brick with dark mortar, bevel and subtle top highlight.
  px(x, y, TILE_SIZE, TILE_SIZE, '#9f3218');
  px(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2, '#c84c24');
  px(x + 1, y + 1, TILE_SIZE - 2, 2, '#e06a32');
  ctx.strokeStyle = '#762313';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y + 8.5); ctx.lineTo(x + TILE_SIZE, y + 8.5);
  ctx.moveTo(x + 8.5, y); ctx.lineTo(x + 8.5, y + 8);
  ctx.moveTo(x + 4.5, y + 9); ctx.lineTo(x + 4.5, y + TILE_SIZE);
  ctx.stroke();
  if (topGround) px(x, y, TILE_SIZE, 2, '#6fbd35');
}

function drawPipeTile(x, y, col, row) {
  const above = row > 0 ? rawMap[row - 1]?.[col] : '.';
  const isHead = above !== 'P';
  const left = isHead ? x - 2 : x + 2;
  const width = isHead ? TILE_SIZE + 4 : TILE_SIZE - 4;
  // dark outline, shaded green body, bright left edge
  px(left, y, width, TILE_SIZE, '#075b20');
  px(left + 2, y, width - 4, TILE_SIZE, '#00a83b');
  px(left + 3, y, 3, TILE_SIZE, '#53d45a');
  px(left + width - 4, y, 2, TILE_SIZE, '#007126');
  if (isHead) {
    px(x - 3, y, TILE_SIZE + 6, 3, '#064b1b');
    px(x - 1, y + 1, TILE_SIZE + 2, 2, '#13c84d');
  }
}

function drawFlagTile(x, y, col, row) {
  px(x + 6, y, 3, TILE_SIZE, '#eee');
  const above = row > 0 ? rawMap[row - 1]?.[col] : '.';
  if (above !== 'L') {
    px(x + 8, y + 1, 8, 5, '#e3262e');
    px(x + 8, y + 2, 6, 2, '#ffcf35');
  }
}

function drawBackground() {
  // Kelantan-inspired layered pixel scenery behind the level.
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const parallax = Math.floor(cameraX * 0.18);
  // soft cloud clusters
  const clouds = [[24, 34, 22], [126, 25, 28], [224, 48, 20]];
  clouds.forEach(([x, y, w]) => {
    const cx = x - parallax;
    px(cx, y + 4, w, 7, '#fff'); px(cx + 5, y, w - 11, 5, '#fff');
    px(cx + 3, y + 9, w - 6, 2, '#dcecff');
  });
  // distant hills
  ctx.fillStyle = '#8bd17c';
  ctx.beginPath(); ctx.moveTo(0, 157);
  for (let x = 0; x <= 256; x += 16) ctx.lineTo(x, 157 - (Math.sin((x + parallax) * 0.045) * 10 + 12));
  ctx.lineTo(256, 208); ctx.lineTo(0, 208); ctx.fill();
  // nearer forest ridge
  ctx.fillStyle = '#3a9a5b';
  ctx.beginPath(); ctx.moveTo(0, 184);
  for (let x = 0; x <= 256; x += 12) ctx.lineTo(x, 184 - (Math.sin((x + parallax) * 0.08) * 7 + 7));
  ctx.lineTo(256, 208); ctx.lineTo(0, 208); ctx.fill();
  // kampung silhouettes and palm trees
  for (let i = 0; i < 4; i++) {
    const hx = i * 92 - (parallax % 92) + 28;
    px(hx, 174, 24, 18, '#7a4b32');
    ctx.fillStyle = '#5c2b2b';
    ctx.beginPath(); ctx.moveTo(hx - 5, 174); ctx.lineTo(hx + 12, 162); ctx.lineTo(hx + 29, 174); ctx.fill();
    px(hx + 7, 183, 5, 9, '#2b4d32'); px(hx + 17, 183, 5, 9, '#2b4d32');
    px(hx + 11, 178, 5, 6, '#f3c75b');
  }
  for (let i = 0; i < 5; i++) {
    const tx = i * 68 - (parallax % 68) + 12;
    px(tx, 164, 3, 30, '#6b4827');
    px(tx - 8, 157, 19, 3, '#176b3b'); px(tx - 5, 151, 13, 3, '#1c8043'); px(tx - 2, 146, 7, 4, '#2b9b4f');
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  for (let r = 0; r < mapHeight; r++) {
    for (let c = 0; c < mapWidth; c++) {
      const t = rawMap[r][c];
      const tileX = c * TILE_SIZE;
      const tileY = r * TILE_SIZE;

      if (t === '#') {
        drawBrickTile(tileX, tileY, r === 13);
      } else if (t === 'M' || t === 'F' || t === 'S') {
        ctx.fillStyle = "#fc9838";
        ctx.fillRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = "#9b4c12";
        ctx.strokeRect(tileX + 1, tileY + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        ctx.fillStyle = "#fff3b0";
        ctx.font = "bold 11px monospace";
        ctx.fillText("?", tileX + 4, tileY + 12);
      } else if (t === 'P') {
        drawPipeTile(tileX, tileY, c, r);
      } else if (t === 'L') {
        drawFlagTile(tileX, tileY, c, r);
      }
    }
  }

  items.forEach(it => drawPowerItem(it));

  ctx.fillStyle = "#f83800";
  fireballs.forEach(fb => ctx.fillRect(fb.x, fb.y, fb.w, fb.h));

  // Recognizable Goomba sprite
  enemies.forEach(e => {
    if (e.alive) drawGoomba(e.x, e.y, e.w, e.h, e.vx < 0);
  });

  // Recognizable Mario sprite
  if (mario.invulnerableTimer % 4 < 2) {
    drawMario(mario.x, mario.y, mario.w, mario.h, mario.vx < 0 ? -1 : 1, mario.state, mario.starTimer > 0, mario.dead);
  }

  ctx.restore();

  if (mario.dead) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 128, 112);
    ctx.font = "7px monospace";
    ctx.fillText("PRESS R TO RESTART", 128, 126);
    ctx.textAlign = "left";
  } else if (win) {
    ctx.fillStyle = "#fcfc00";
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    ctx.fillText("STAGE CLEAR!", 128, 112);
    ctx.fillStyle = "#fff";
    ctx.font = "7px monospace";
    ctx.fillText("PRESS R TO RESTART", 128, 126);
    ctx.textAlign = "left";
  }
}

window.addEventListener("keydown", e => {
  if (e.code === "KeyR" && (mario.dead || win)) location.reload();
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
