<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Mario Evolution 2 - Power-Ups & Refined 1-1</title>
  <style>
    body {
      margin: 0;
      background: #151515;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #fff;
    }
    canvas {
      border: 3px solid #444;
      background: #5c94fc;
      image-rendering: pixelated;
    }
    .hud {
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>

<div class="hud">
  <span>STATUS: <b id="ui-state">SMALL</b></span>
  <span>SCORE: <b id="ui-score">00000</b></span>
  <span>STAR: <b id="ui-star">OFF</b></span>
</div>
<canvas id="game" width="256" height="240"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.style.width = "768px";
canvas.style.height = "720px";

const TILE_SIZE = 16;
const GRAVITY = 0.28;

const keys = {};
window.addEventListener("keydown", e => {
  if (e.code === "KeyZ" || e.code === "KeyJ") shootFireball();
  keys[e.code] = true;
});
window.addEventListener("keyup", e => keys[e.code] = false);

// Peta dibaiki: Tiada paip melebihi 3 blok, lubang maksimum 2 blok (boleh lompat terus)
let rawMap = [
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "..................................................................................L.................",
  "....................#M#.......................#S#.................................L.......####......",
  ".............................F....................................................L.......#..#......",
  "...........................####...........................................#.......L.......#..#......",
  "..................P........####.........P...............P................##.......L.......#..#......",
  "###################..####################..##############..################..#######################",
  "###################..####################..##############..################..#######################"
].map(row => row.split(\'\'));

const mapWidth = rawMap[0].length;
const mapHeight = rawMap.length;

let score = 0;
let cameraX = 0;
let win = false;

// 0: Small, 1: Super, 2: Fire
const mario = {
  x: 24,
  y: 160,
  vx: 0,
  vy: 0,
  w: 12,
  h: 15,
  state: 0,
  grounded: false,
  dead: false,
  starTimer: 0,
  invulnerableTimer: 0
};

const items = [];
const fireballs = [];
const enemies = [
  { x: 180, y: 190, vx: -0.5, w: 14, h: 14, alive: true },
  { x: 360, y: 190, vx: -0.5, w: 14, h: 14, alive: true },
  { x: 620, y: 190, vx: -0.5, w: 14, h: 14, alive: true },
  { x: 800, y: 190, vx: -0.5, w: 14, h: 14, alive: true }
];

function getTile(tx, ty) {
  if (tx < 0 || tx >= mapWidth || ty < 0 || ty >= mapHeight) return \'.\';
  return rawMap[ty][tx];
}

function isSolid(tile) {
  return tile === \'#\' || tile === \'P\' || tile === \'M\' || tile === \'F\' || tile === \'S\';
}

function checkTileCollision(x, y, w, h) {
  const sx = Math.floor(x / TILE_SIZE);
  const ex = Math.floor((x + w - 0.1) / TILE_SIZE);
  const sy = Math.floor(y / TILE_SIZE);
  const ey = Math.floor((y + h - 0.1) / TILE_SIZE);

  for (let ty = sy; ty <= ey; ty++) {
    for (let tx = sx; tx <= ex; tx++) {
      if (isSolid(getTile(tx, ty))) {
        return { hit: true, tx, ty, tile: getTile(tx, ty) };
      }
    }
  }
  return { hit: false };
}

function triggerBlock(tx, ty, tile) {
  if (tile === \'M\' || tile === \'F\' || tile === \'S\') {
    rawMap[ty][tx] = \'#\';
    items.push({
      type: tile,
      x: tx * TILE_SIZE,
      y: (ty - 1) * TILE_SIZE,
      vx: tile === \'F\' ? 0 : 1,
      vy: tile === \'S\' ? -3 : -1,
      w: 12,
      h: 12,
      grounded: false
    });
  }
}

function shootFireball() {
  if (mario.state !== 2 || mario.dead || fireballs.length >= 2) return;
  fireballs.push({
    x: mario.x + (mario.vx >= 0 ? mario.w : -8),
    y: mario.y + 4,
    vx: mario.vx >= 0 ? 3.5 : -3.5,
    vy: 1,
    w: 6,
    h: 6
  });
}

function damageMario() {
  if (mario.starTimer > 0 || mario.invulnerableTimer > 0) return;
  if (mario.state > 0) {
    mario.state = 0;
    mario.h = 15;
    mario.invulnerableTimer = 120;
  } else {
    mario.dead = true;
  }
}

function update() {
  if (mario.dead || win) return;

  if (mario.starTimer > 0) mario.starTimer--;
  if (mario.invulnerableTimer > 0) mario.invulnerableTimer--;

  if (keys["ArrowRight"] || keys["KeyD"]) mario.vx += 0.15;
  else if (keys["ArrowLeft"] || keys["KeyA"]) mario.vx -= 0.15;
  else mario.vx *= 0.82;

  const maxSpeed = keys["ShiftLeft"] ? 2.5 : 1.8;
  mario.vx = Math.max(Math.min(mario.vx, maxSpeed), -maxSpeed);

  if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && mario.grounded) {
    mario.vy = -6.2;
    mario.grounded = false;
  }

  mario.vy += GRAVITY;
  if (mario.vy > 7) mario.vy = 7;

  mario.x += mario.vx;
  let colX = checkTileCollision(mario.x, mario.y, mario.w, mario.h);
  if (colX.hit) {
    mario.x -= mario.vx;
    mario.vx = 0;
  }

  mario.y += mario.vy;
  mario.grounded = false;
  let colY = checkTileCollision(mario.x, mario.y, mario.w, mario.h);
  if (colY.hit) {
    if (mario.vy > 0) {
      mario.grounded = true;
    } else if (mario.vy < 0) {
      triggerBlock(colY.tx, colY.ty, colY.tile);
    }
    mario.y -= mario.vy;
    mario.vy = 0;
  }

  if (mario.y > 240) mario.dead = true;

  const currentTileX = Math.floor((mario.x + mario.w / 2) / TILE_SIZE);
  const currentTileY = Math.floor((mario.y + mario.h / 2) / TILE_SIZE);
  if (getTile(currentTileX, currentTileY) === \'L\') win = true;

  if (mario.x - cameraX > 110) cameraX = mario.x - 110;
  if (mario.x < cameraX) mario.x = cameraX;

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.vy += GRAVITY;
    it.x += it.vx;
    if (checkTileCollision(it.x, it.y, it.w, it.h).hit) it.vx *= -1;

    it.y += it.vy;
    const itColY = checkTileCollision(it.x, it.y, it.w, it.h);
    if (itColY.hit) {
      it.y -= it.vy;
      if (it.type === \'S\') it.vy = -3.5;
      else { it.vy = 0; it.grounded = true; }
    }
    if (mario.x < it.x + it.w && mario.x + mario.w > it.x &&
        mario.y < it.y + it.h && mario.y + mario.h > it.y) {
      if (it.type === \'M\') {
        if (mario.state === 0) { mario.state = 1; mario.y -= 7; mario.h = 22; }
      } else if (it.type === \'F\') {
        mario.state = 2;
        if (mario.h === 15) { mario.y -= 7; mario.h = 22; }
      } else if (it.type === \'S\') {
        mario.starTimer = 600;
      }
      score += 1000;
      items.splice(i, 1);
    }
  }

  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.y += fb.vy;
    fb.vy += GRAVITY;

    if (checkTileCollision(fb.x, fb.y, fb.w, fb.h).hit) {
      fb.vy = -2.8;
    }

    if (fb.x > cameraX + 270 || fb.x < cameraX - 20 || fb.y > 240) {
      fireballs.splice(i, 1);
      continue;
    }

    let hit = false;
    enemies.forEach(e => {
      if (!hit && e.alive && fb.x < e.x + e.w && fb.x + fb.w > e.x && fb.y < e.y + e.h && fb.y + fb.h > e.y) {
        e.alive = false;
        hit = true;
        score += 200;
      }
    });
    if (hit) { fireballs.splice(i, 1); }
  }

  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    if (checkTileCollision(e.x, e.y, e.w, e.h).hit) e.vx *= -1;

    if (mario.x < e.x + e.w && mario.x + mario.w > e.x &&
        mario.y < e.y + e.h && mario.y + mario.h > e.y) {
      if (mario.starTimer > 0) {
        e.alive = false;
        score += 200;
      } else if (mario.vy > 0 && mario.y + mario.h - e.y < 8) {
        e.alive = false;
        mario.vy = -3.8;
        score += 100;
      } else {
        damageMario();
      }
    }
  });

  const stateNames = ["SMALL", "SUPER", "FIRE"];
  document.getElementById("ui-state").innerText = stateNames[mario.state];
  document.getElementById("ui-score").innerText = String(score).padStart(5, \'0\');
  document.getElementById("ui-star").innerText = mario.starTimer > 0 ? (Math.ceil(mario.starTimer/60) + "s") : "OFF";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  for (let r = 0; r < mapHeight; r++) {
    for (let c = 0; c < mapWidth; c++) {
      const t = rawMap[r][c];
      const px = c * TILE_SIZE;
      const py = r * TILE_SIZE;

      if (t === \'#\') {
        ctx.fillStyle = "#b84418";
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      } else if (t === \'M\' || t === \'F\' || t === \'S\') {
        ctx.fillStyle = "#fc9838";
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#fff";
        ctx.fillText("?", px + 4, py + 12);
      } else if (t === \'P\') {
        ctx.fillStyle = "#00a800";
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      } else if (t === \'L\') {
        ctx.fillStyle = "#fcfcfc";
        ctx.fillRect(px + 6, py, 4, TILE_SIZE);
      }
    }
  }

  items.forEach(it => {
    if (it.type === \'M\') ctx.fillStyle = "#fc3800";
    else if (it.type === \'F\') ctx.fillStyle = "#ff77aa";
    else if (it.type === \'S\') ctx.fillStyle = "#fcfc00";
    ctx.fillRect(it.x, it.y, it.w, it.h);
  });

  ctx.fillStyle = "#f83800";
  fireballs.forEach(fb => ctx.fillRect(fb.x, fb.y, fb.w, fb.h));

  enemies.forEach(e => {
    if (e.alive) {
      ctx.fillStyle = "#743800";
      ctx.fillRect(e.x, e.y, e.w, e.h);
    }
  });

  if (mario.invulnerableTimer % 4 < 2) {
    if (mario.starTimer > 0) {
      const colors = ["#fcfc00", "#fc3800", "#00a800", "#fcfcfc"];
      ctx.fillStyle = colors[Math.floor(Date.now() / 60) % colors.length];
    } else if (mario.state === 2) {
      ctx.fillStyle = "#fcfcfc";
    } else {
      ctx.fillStyle = mario.dead ? "#555" : "#e40058";
    }
    ctx.fillRect(mario.x, mario.y, mario.w, mario.h);
  }

  ctx.restore();

  if (mario.dead) {
    ctx.fillStyle = "#fff";
    ctx.font = "14px monospace";
    ctx.fillText("GAME OVER - Press R to Restart", 30, 120);
  } else if (win) {
    ctx.fillStyle = "#fcfc00";
    ctx.font = "14px monospace";
    ctx.fillText("STAGE CLEAR! Press R to Restart", 25, 120);
  }
}

window.addEventListener("keydown", e => {
  if (e.code === "KeyR" && (mario.dead || win)) location.reload();
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
