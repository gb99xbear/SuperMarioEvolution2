<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Mario Evolution 2 - Edisi Kelantan</title>
  <style>
    * { box-sizing: border-box; -webkit-font-smoothing: none; font-smooth: never; }
    html, body {
      margin: 0;
      background: #0c0c0c;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Courier New', 'Lucida Console', monospace;
      color: #fff;
      text-rendering: optimizeSpeed;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    /* Retro CRT-bezel frame around the playfield */
    .crt {
      position: relative;
      padding: 28px 28px 60px 28px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
      border: 4px solid #2a2a2a;
      border-radius: 18px 18px 30px 30px;
      box-shadow:
        inset 0 0 0 2px #000,
        inset 0 4px 0 #2c2c2c,
        inset 0 -4px 0 #050505,
        0 0 0 6px #181818,
        0 12px 30px rgba(0, 0, 0, 0.6);
    }
    .crt::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid #2a2a2a;
      border-radius: 12px 12px 22px 22px;
      pointer-events: none;
    }
    /* Power LED + cartridge label strip under the canvas */
    .crt::after {
      content: "● POWER   SUPER MARIO EVOLUTION 2 - KELANTAN";
      position: absolute;
      bottom: 14px;
      left: 36px;
      right: 36px;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #555;
      text-shadow: 0 0 4px rgba(80, 200, 80, 0.25);
    }
    .power-led {
      position: absolute;
      bottom: 16px;
      right: 22px;
      width: 8px;
      height: 8px;
      background: #4d2;
      border-radius: 50%;
      box-shadow: 0 0 6px #4d2, inset 0 0 2px #fff;
    }
    canvas {
      display: block;
      background: #2b1810;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #000;
    }
    .hud {
      margin: 12px 0 8px 0;
      font-size: 14px;
      display: flex;
      gap: 24px;
      align-items: center;
      letter-spacing: 1px;
    }
    .hud .lives-icons { display: inline-block; vertical-align: middle; margin-left: 6px; line-height: 0; }
    .hud .lives-icons canvas { display: inline-block; width: 18px; height: 18px; image-rendering: pixelated; vertical-align: middle; }
    .hud b { color: #ffd166; }
    .hud .lbl { color: #999; margin-right: 4px; font-size: 11px; }
  </style>
</head>
<body>

<div class="hud">
  <span><span class="lbl">STATUS</span><b id="ui-state">SMALL</b></span>
  <span><span class="lbl">NYAWA</span><b id="ui-lives">3</b><span class="lives-icons" id="ui-lives-icons"></span></span>
  <span><span class="lbl">SKOR</span><b id="ui-score">00000</b></span>
  <span><span class="lbl">BINTANG</span><b id="ui-star">OFF</b></span>
</div>

<div class="crt">
  <canvas id="game" width="256" height="240"></canvas>
  <div class="power-led"></div>
</div>

<script>
// ============================================================
//  SUPER MARIO EVOLUTION 2 — KELANTAN EDITION
//  Single-file vanilla JS / HTML5 Canvas platformer.
//  Features: TITLE screen, retro bezel, lives icons, longer
//  stages, breakable bricks, full SFX, multi-stage.
// ============================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
canvas.style.width = "768px";
canvas.style.height = "720px";

const TILE_SIZE = 16;
const GRAVITY = 0.28;
const TERMINAL = 7.0;
const JUMP_V = -6.2;

// ------------------------------------------------------------
//  Audio — Web Audio square/triangle/sawtooth synth, zero assets
// ------------------------------------------------------------
let audioCtx = null;
let masterGain = null;
function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.06;
    masterGain.connect(audioCtx.destination);
  } catch (_) { audioCtx = null; }
}
function sfx(opts) {
  if (!opts) return;
  ensureAudio();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = opts.type || "square";
  osc.frequency.setValueAtTime(opts.freq || 440, t);
  if (opts.endFreq) osc.frequency.exponentialRampToValueAtTime(opts.endFreq, t + (opts.dur || 0.1));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(opts.vol || 0.5, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (opts.dur || 0.1));
  osc.connect(g); g.connect(masterGain);
  osc.start(t);
  osc.stop(t + (opts.dur || 0.1) + 0.02);
}
// Named SFX library — every gameplay event has a sound
const SND = {
  jump:    () => sfx({ freq: 520, endFreq: 880, dur: 0.12, type: "square",    vol: 0.45 }),
  bigJump: () => sfx({ freq: 420, endFreq: 760, dur: 0.14, type: "square",    vol: 0.50 }),
  stomp:   () => sfx({ freq: 220, endFreq:  60, dur: 0.10, type: "triangle",  vol: 0.55 }),
  bump:    () => sfx({ freq: 180, endFreq: 110, dur: 0.06, type: "square",    vol: 0.45 }),
  break:   () => sfx({ freq: 320, endFreq:  90, dur: 0.14, type: "sawtooth",  vol: 0.55 }),
  coin:    () => sfx({ freq: 988, endFreq: 1318, dur: 0.09, type: "square",   vol: 0.40 }),
  power:   () => sfx({ freq: 523, endFreq: 1568, dur: 0.30, type: "square",   vol: 0.45 }),
  fireball:() => sfx({ freq: 260, endFreq: 140, dur: 0.08, type: "sawtooth",  vol: 0.35 }),
  fireHit: () => sfx({ freq: 200, endFreq:  80, dur: 0.10, type: "triangle",  vol: 0.45 }),
  pipe:    () => sfx({ freq: 140, endFreq: 260, dur: 0.18, type: "sine",      vol: 0.35 }),
  death:   () => sfx({ freq: 600, endFreq:  80, dur: 0.70, type: "sawtooth",  vol: 0.50 }),
  gameOver:() => sfx({ freq: 220, endFreq:  55, dur: 1.00, type: "square",    vol: 0.50 }),
  clear:   () => sfx({ freq: 523, endFreq: 1046, dur: 0.30, type: "triangle",  vol: 0.45 }),
  fanfare: () => sfx({ freq: 784, endFreq: 1568, dur: 0.50, type: "square",   vol: 0.45 }),
  start:   () => sfx({ freq: 440, endFreq: 880, dur: 0.20, type: "square",   vol: 0.45 }),
  move:    () => sfx({ freq: 110, dur: 0.04, type: "sine", vol: 0.18 })
};

// ------------------------------------------------------------
//  Input
// ------------------------------------------------------------
const keys = {};
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyZ" || e.code === "KeyJ") shootFireball();
  if (e.code === "Enter" && titleState) startGame();
  if (e.code === "KeyR" && (mario.dead || win || gameOver)) resetGame();
  if (e.code === "KeyM") muted = !muted;
  keys[e.code] = true;
  ensureAudio();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ------------------------------------------------------------
//  Long, hand-crafted stage — World 1-1 inspired
//  Legend: . air  # ground/brick  ? question (M)  B breakable brick
//          P pipe  L flagpole  F fire-flower  S star
//          (lowercase) g gap pit (handled by ground removal)
//
//  Map is 212 tiles wide × 15 tiles tall (= 3392 × 240 px)
//  Lengths: stage 1 = 212 tiles, stage 2 = 232, stage 3 = 252
// ------------------------------------------------------------
const STAGE_ROWS = 15;
const STAGE_COLS_BY_IDX = [212, 232, 252];

function buildStage(seed) {
  // World 1-1-inspired layout: rhythmic obstacles, classic pit patterns,
  // iconic question/breakable brick combos, and the famous staircase.
  // Stage length grows with seed (212/232/252 tiles wide).
  const W = STAGE_COLS_BY_IDX[seed] || 212;
  const rows = [];
  for (let r = 0; r < STAGE_ROWS; r++) {
    rows.push(new Array(W).fill("."));
  }
  // Solid ground (rows 13-14)
  for (let c = 0; c < W; c++) {
    rows[13][c] = "#";
    rows[14][c] = "#";
  }
  // Stage 1: World 1-1 classic — 2 pits, brick stairs near flagpole
  // Stage 2: extra mid-stage pit + longer ceiling
  // Stage 3: triple pit sequence + underground-style low ceiling
  const pitSets = [
    [[69, 71], [85, 87]],            // 2 pits like World 1-1
    [[69, 71], [85, 87], [128, 130]], // stage 2: extra
    [[69, 71], [85, 87], [128, 130], [165, 167]] // stage 3: gauntlet
  ];
  (pitSets[seed] || pitSets[0]).forEach(([a, b]) => {
    if (a < W && b < W) {
      for (let c = a; c <= b; c++) { rows[13][c] = "."; rows[14][c] = "."; }
    }
  });

  // Tile placements: [col, row, type]
  // Each row of the array = one "rhythmic beat" of level design
  const scene = [
    // SECTION 1: gentle intro (col 0-40)
    [16, 11, "?"], [20, 11, "B"], [22, 11, "?"], [24, 11, "B"], [28, 11, "B"],
    // Pipe 1 (1-tall, can walk over)
    [38, 12, "P"],
    // SECTION 2: first challenge (col 40-68)
    [40, 11, "?"], [46, 11, "B"], [48, 11, "B"], [50, 11, "?"],
    [55, 12, "P"], [55, 11, "P"],    // pipe 2 (2-tall)
    [62, 10, "B"], [64, 10, "?"], [66, 10, "B"],
    // SECTION 3: first pit @ col 69-71
    // After pit, recovery ground
    // SECTION 4: brick ceiling (col 78-86) — "?" + breakable pattern
    [78, 7, "B"], [80, 7, "?"], [82, 7, "B"], [84, 7, "B"],
    // Pipe 3 (3-tall) just before second pit
    [78, 12, "P"], [78, 11, "P"], [78, 10, "P"],
    // SECTION 5: second pit @ col 85-87
    // Recovery + star surprise
    [92, 8, "?"], [100, 12, "P"],
    // SECTION 6: ramp up (col 100-130)
    [108, 11, "B"], [110, 11, "B"], [112, 11, "?"], [114, 11, "B"],
    [120, 10, "B"], [122, 10, "?"],
    [128, 9, "B"], [130, 9, "?"], [132, 9, "B"],
    // SECTION 7: pit 3 (stage 2+) + underground section
    [142, 12, "P"], [142, 11, "P"],
    [148, 11, "B"], [150, 11, "?"], [152, 11, "B"],
    [160, 10, "B"], [162, 10, "B"], [164, 10, "?"], [166, 10, "B"],
  ];
  if (seed >= 1) {
    scene.push([180, 11, "B"], [184, 11, "B"], [188, 11, "?"], [192, 11, "B"]);
    scene.push([200, 12, "P"], [200, 11, "P"]);
  }
  if (seed >= 2) {
    scene.push([205, 10, "B"], [208, 10, "?"], [211, 10, "B"]);
    scene.push([220, 11, "B"], [224, 11, "B"], [228, 11, "?"], [232, 11, "B"]);
  }
  // Iconic brick staircase leading up to flagpole (always present, like 1-1)
  // 8-step staircase, 2-wide each, ascending 1 tile every 4 cols
  const stairStart = seed === 0 ? 196 : (seed === 1 ? 216 : 236);
  for (let step = 0; step < 8; step++) {
    for (let w = 0; w < step + 1; w++) {
      const col = stairStart + step * 2 + w;
      const row = 12 - step;
      if (col < W && row >= 0) scene.push([col, row, "#"]);
    }
  }
  // Apply all tile placements
  scene.forEach(([c, r, t]) => {
    if (c >= 0 && c < W && r >= 0 && r < STAGE_ROWS) rows[r][c] = t;
  });

  // Flagpole at the top of the staircase
  const flagCol = Math.min(W - 14, stairStart - 4);
  for (let h = 0; h < 9; h++) {
    if (13 - h >= 0) rows[13 - h][flagCol] = "L";
  }
  // Castle (last 6 columns)
  for (let c = W - 6; c < W; c++) {
    if (c >= 0) {
      rows[10][c] = "#";
      rows[11][c] = "#";
      rows[12][c] = "#";
    }
  }
  return rows;
}

let rawMap = buildStage(0);
function rebuildMap(idx) {
  rawMap = buildStage(idx);
  mapWidth = rawMap[0].length;
  mapHeight = rawMap.length;
}
let mapWidth = rawMap[0].length;
let mapHeight = rawMap.length;

// ------------------------------------------------------------
//  Game state
// ------------------------------------------------------------
const STAGES = [
  { name: "KAMPUNG PAGI",   sub: "Abe Yo bertolak dari kampung" },
  { name: "SAWAH KELANTAN", sub: "Banjaran sawah padi menantang" },
  { name: "RIMBA TOK BALI", sub: "Hutan rimba penuh misteri" }
];
let stageIndex = 0;
let score = 0;
let coins = 0;
let lives = 3;
let cameraX = 0;
let win = false;
let gameOver = false;
let titleState = true;
let stageClearTimer = 0;
let stageClearScore = 0;
let muted = false;

const mario = {
  x: 24, y: 160, vx: 0, vy: 0, w: 12, h: 15,
  state: 0, grounded: false, dead: false,
  starTimer: 0, invulnerableTimer: 0, facing: 1
};
const items = [];
const fireballs = [];
const particles = [];
const enemies = [];

// Hand-placed enemy spawns — World 1-1 style rhythm.
// 2 goombas near intro, 1 after pipe 1, 2-3 around the pits,
// 2 on the staircase approach, 1 near the second pit.
// Coordinates are world-pixel (col * 16 + offset).
const ENEMY_LAYOUTS = [
  // Stage 1: classic 1-1 pacing — 5 goombas
  [
    { x: 22 * 16, y: 192 },  // intro goomba
    { x: 40 * 16, y: 192 },  // after pipe 1
    { x: 51 * 16, y: 192 },  // near pipe 2
    { x: 60 * 16, y: 192 },  // before first pit
    { x: 95 * 16, y: 192 }   // after second pit
  ],
  // Stage 2: 6 goombas, tighter spacing
  [
    { x: 22 * 16, y: 192 },
    { x: 38 * 16, y: 192 },
    { x: 50 * 16, y: 192 },
    { x: 75 * 16, y: 192 },
    { x: 105 * 16, y: 192 },
    { x: 140 * 16, y: 192 }
  ],
  // Stage 3: 7 goombas, gauntlet
  [
    { x: 22 * 16, y: 192 },
    { x: 40 * 16, y: 192 },
    { x: 60 * 16, y: 192 },
    { x: 90 * 16, y: 192 },
    { x: 120 * 16, y: 192 },
    { x: 150 * 16, y: 192 },
    { x: 180 * 16, y: 192 }
  ]
];

function spawnEnemiesForStage(idx) {
  enemies.length = 0;
  const layout = ENEMY_LAYOUTS[idx] || ENEMY_LAYOUTS[0];
  layout.forEach((pos, i) => {
    enemies.push({
      x: pos.x, y: pos.y,
      vx: (i % 2 ? 0.5 : -0.5) - idx * 0.05,
      w: 14, h: 14, alive: true, type: "goomba"
    });
  });
}

// ------------------------------------------------------------
//  Tile helpers
// ------------------------------------------------------------
function getTile(tx, ty) {
  if (tx < 0 || tx >= mapWidth || ty < 0 || ty >= mapHeight) return ".";
  return rawMap[ty][tx];
}
function setTile(tx, ty, v) {
  if (tx < 0 || tx >= mapWidth || ty < 0 || ty >= mapHeight) return;
  rawMap[ty][tx] = v;
}
function isSolid(t) {
  return t === "#" || t === "B" || t === "P" || t === "?" || t === "M" || t === "F" || t === "S";
}
function isBreakable(t) { return t === "B"; }
function isQuestion(t) { return t === "?"; }
function isPipe(t) { return t === "P"; }

function checkTileCollision(x, y, w, h) {
  const sx = Math.floor(x / TILE_SIZE);
  const ex = Math.floor((x + w - 0.1) / TILE_SIZE);
  const sy = Math.floor(y / TILE_SIZE);
  const ey = Math.floor((y + h - 0.1) / TILE_SIZE);
  for (let ty = sy; ty <= ey; ty++) {
    for (let tx = sx; tx <= ex; tx++) {
      const t = getTile(tx, ty);
      if (isSolid(t)) return { hit: true, tx, ty, tile: t };
    }
  }
  return { hit: false };
}

function bumpBlock(tx, ty) {
  const tile = getTile(tx, ty);
  if (tile === "?") {
    setTile(tx, ty, "#"); // used
    if (mario.state === 0) {
      // spawn mushroom if small, fire if big
      items.push({ type: "M", x: tx * TILE_SIZE, y: (ty - 1) * TILE_SIZE, vx: 1.4, vy: -1, w: 12, h: 12, grounded: false });
    } else {
      items.push({ type: "F", x: tx * TILE_SIZE, y: (ty - 1) * TILE_SIZE, vx: 0, vy: -1, w: 12, h: 12, grounded: false });
    }
    score += 200; coins++;
    SND.coin();
    return "spawn";
  } else if (tile === "B") {
    if (mario.state > 0) {
      // Big Mario breaks bricks
      setTile(tx, ty, ".");
      score += 50;
      SND.break();
      for (let k = 0; k < 6; k++) particles.push({
        x: tx * TILE_SIZE + 8, y: ty * TILE_SIZE + 8,
        vx: (Math.random() - 0.5) * 3, vy: -2 - Math.random() * 2,
        life: 30, color: "#c84c24", w: 3, h: 3
      });
      return "break";
    } else {
      SND.bump();
      return "bump";
    }
  }
  return "none";
}

function shootFireball() {
  if (mario.state !== 2 || mario.dead || gameOver || win) return;
  if (fireballs.length >= 2) return;
  fireballs.push({
    x: mario.x + (mario.facing >= 0 ? mario.w : -8),
    y: mario.y + 4,
    vx: mario.facing >= 0 ? 3.8 : -3.8,
    vy: 1, w: 6, h: 6, life: 200
  });
  SND.fireball();
}

function damageMario() {
  if (mario.starTimer > 0 || mario.invulnerableTimer > 0) return;
  if (mario.state > 0) {
    mario.state = 0; mario.h = 15; mario.y -= 7; mario.invulnerableTimer = 120;
    SND.bump();
  } else {
    loseLife();
  }
}

function resetStage() {
  mario.x = 24; mario.y = 160; mario.vx = 0; mario.vy = 0;
  mario.state = 0; mario.h = 15; mario.dead = false;
  mario.starTimer = 0; mario.invulnerableTimer = 0;
  cameraX = 0; win = false;
  items.length = 0; fireballs.length = 0; particles.length = 0;
  rebuildMap(stageIndex);
  spawnEnemiesForStage(stageIndex);
}

function loseLife() {
  if (mario.dead || win || gameOver) return;
  lives--;
  SND.death();
  if (lives <= 0) {
    gameOver = true; mario.dead = true;
    setTimeout(() => { /* GAME OVER screen waits for R */ }, 700);
    return;
  }
  mario.dead = true;
  setTimeout(() => { if (!gameOver) { resetStage(); mario.invulnerableTimer = 120; } }, 700);
}

function advanceStage() {
  if (stageClearTimer > 0) return;
  SND.clear();
  stageIndex++;
  stageClearScore = (STAGE_COLS_BY_IDX[stageIndex - 1] - Math.floor(cameraX / TILE_SIZE)) * 10;
  score += stageClearScore;
  if (stageIndex >= STAGES.length) {
    win = true;
    setTimeout(() => SND.fanfare(), 200);
    return;
  }
  stageClearTimer = 90; // ~1.5s pause
  setTimeout(() => { if (!win) resetStage(); }, 1400);
}

function resetGame() {
  score = 0; coins = 0; lives = 3; stageIndex = 0; gameOver = false; win = false;
  titleState = false;
  stageClearTimer = 0;
  rebuildMap(0);
  resetStage();
  SND.start();
}

function startGame() {
  if (!titleState) return;
  SND.start();
  titleState = false;
  resetStage();
}

// ------------------------------------------------------------
//  Update loop
// ------------------------------------------------------------
function update() {
  if (titleState) return;
  if (stageClearTimer > 0) { stageClearTimer--; return; }
  if (mario.dead || win || gameOver) return;

  // Star power / invuln timers
  if (mario.starTimer > 0) mario.starTimer--;
  if (mario.invulnerableTimer > 0) mario.invulnerableTimer--;

  // Movement
  const left  = keys["ArrowLeft"]  || keys["KeyA"];
  const right = keys["ArrowRight"] || keys["KeyD"];
  const sprint = keys["ShiftLeft"];
  if (right) { mario.vx += 0.18; mario.facing = 1; }
  else if (left) { mario.vx -= 0.18; mario.facing = -1; }
  else mario.vx *= 0.84;
  const maxSpeed = sprint ? 2.8 : 1.9;
  if (mario.vx > maxSpeed) mario.vx = maxSpeed;
  if (mario.vx < -maxSpeed) mario.vx = -maxSpeed;

  // Jump (with variable height)
  if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && mario.grounded) {
    mario.vy = JUMP_V;
    mario.grounded = false;
    SND.jump();
  }
  if (!(keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && mario.vy < -2.5) {
    mario.vy = -2.5; // cut jump short
  }

  mario.vy += GRAVITY;
  if (mario.vy > TERMINAL) mario.vy = TERMINAL;

  // Horizontal movement + collision
  mario.x += mario.vx;
  let colX = checkTileCollision(mario.x, mario.y, mario.w, mario.h);
  if (colX.hit) { mario.x -= mario.vx; mario.vx = 0; }

  // Vertical movement + collision
  mario.y += mario.vy;
  mario.grounded = false;
  let colY = checkTileCollision(mario.x, mario.y, mario.w, mario.h);
  if (colY.hit) {
    if (mario.vy > 0) {
      mario.grounded = true;
    } else if (mario.vy < 0) {
      // Head-butt: bump question/breakable block
      const r = bumpBlock(colY.tx, colY.ty);
      if (r === "none" || r === "bump") SND.bump();
      // Bump animation: nudge the hit tile upward briefly (visual only)
      hitBumpTiles.push({ tx: colY.tx, ty: colY.ty, life: 6 });
    }
    mario.y -= mario.vy;
    mario.vy = 0;
  }

  // Fall out of world
  if (mario.y > mapHeight * TILE_SIZE) loseLife();

  // Flagpole / win check
  const cX = Math.floor((mario.x + mario.w / 2) / TILE_SIZE);
  const cY = Math.floor((mario.y + mario.h / 2) / TILE_SIZE);
  if (getTile(cX, cY) === "L" || getTile(cX, cY - 1) === "L") advanceStage();

  // Camera (left-locked)
  const targetCam = mario.x - 110;
  if (targetCam > cameraX) cameraX = targetCam;
  if (mario.x < cameraX) mario.x = cameraX;
  if (cameraX < 0) cameraX = 0;

  // Items (mushrooms, flowers, stars)
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.vy += GRAVITY;
    if (it.vy > 4) it.vy = 4;
    it.x += it.vx;
    if (checkTileCollision(it.x, it.y, it.w, it.h).hit) it.vx *= -1;
    it.y += it.vy;
    const itColY = checkTileCollision(it.x, it.y, it.w, it.h);
    if (itColY.hit) {
      it.y -= it.vy;
      if (it.type === "S") it.vy = -3.5;
      else { it.vy = 0; it.grounded = true; }
    }
    // Mario pickup
    if (mario.x < it.x + it.w && mario.x + mario.w > it.x &&
        mario.y < it.y + it.h && mario.y + mario.h > it.y) {
      if (it.type === "M") {
        if (mario.state === 0) { mario.state = 1; mario.y -= 7; mario.h = 22; }
        SND.power();
      } else if (it.type === "F") {
        mario.state = 2;
        if (mario.h === 15) { mario.y -= 7; mario.h = 22; }
        SND.power();
      } else if (it.type === "S") {
        mario.starTimer = 600;
        SND.power();
      }
      score += 1000;
      items.splice(i, 1);
    }
  }

  // Fireballs
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.vy += GRAVITY;
    fb.life--;
    if (checkTileCollision(fb.x, fb.y, fb.w, fb.h).hit) fb.vy = -3.2;
    if (fb.life <= 0 || fb.y > 240) { fireballs.splice(i, 1); continue; }
    let hit = false;
    enemies.forEach(e => {
      if (!hit && e.alive && fb.x < e.x + e.w && fb.x + fb.w > e.x &&
          fb.y < e.y + e.h && fb.y + fb.h > e.y) {
        e.alive = false; hit = true; score += 200;
        SND.fireHit();
        for (let k = 0; k < 4; k++) particles.push({
          x: e.x + 6, y: e.y + 6,
          vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 2,
          life: 25, color: "#ff7a3a", w: 2, h: 2
        });
      }
    });
    if (hit) fireballs.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    if (checkTileCollision(e.x, e.y, e.w, e.h).hit) e.vx *= -1;
    if (e.x < cameraX) { e.x = cameraX; e.vx = Math.abs(e.vx); }

    if (mario.x < e.x + e.w && mario.x + mario.w > e.x &&
        mario.y < e.y + e.h && mario.y + mario.h > e.y) {
      if (mario.starTimer > 0) {
        e.alive = false; score += 200; SND.stomp();
      } else if (mario.vy > 0 && mario.y + mario.h - e.y < 10) {
        e.alive = false; mario.vy = -4.0; score += 100; SND.stomp();
        for (let k = 0; k < 4; k++) particles.push({
          x: e.x + 6, y: e.y + 6,
          vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random(),
          life: 20, color: "#c84c24", w: 2, h: 2
        });
      } else {
        damageMario();
      }
    }
  });

  // Hit-bump animation timer
  for (let i = hitBumpTiles.length - 1; i >= 0; i--) {
    hitBumpTiles[i].life--;
    if (hitBumpTiles[i].life <= 0) hitBumpTiles.splice(i, 1);
  }

  // HUD
  const stateNames = ["KECIL", "SADO", "BISA"];
  document.getElementById("ui-state").innerText = stateNames[mario.state];
  document.getElementById("ui-score").innerText = String(score).padStart(6, "0");
  document.getElementById("ui-star").innerText = mario.starTimer > 0 ? (Math.ceil(mario.starTimer / 60) + "s") : "MATI";
  document.getElementById("ui-lives").innerText = gameOver ? 0 : Math.max(0, lives);
  renderLifeIcons();
}

const hitBumpTiles = [];
const lifeIcons = [];

// ------------------------------------------------------------
//  Pixel-art helpers & sprites
// ------------------------------------------------------------
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, w), Math.max(1, h));
}
function drawGoomba(x, y, w, h, facingLeft) {
  x = Math.round(x); y = Math.round(y);
  px(x + 1, y + 5, w - 2, h - 5, "#351812");
  px(x + 2, y + 3, w - 4, 8, "#6e2b18");
  px(x + 4, y + 2, w - 8, 2, "#a94a20");
  px(x + 2, y + 7, w - 4, 5, "#9b3d1d");
  px(x + 3, y + 5, 4, 2, "#24100d"); px(x + w - 7, y + 5, 4, 2, "#24100d");
  px(x + 4, y + 7, 3, 3, "#fff4cf"); px(x + w - 7, y + 7, 3, 3, "#fff4cf");
  px(x + (facingLeft ? 4 : 5), y + 7, 2, 3, "#111");
  px(x + w - (facingLeft ? 5 : 6), y + 7, 2, 3, "#111");
  px(x - 1, y + h - 3, 7, 3, "#3b1712"); px(x + w - 6, y + h - 3, 7, 3, "#3b1712");
  px(x + 1, y + h - 1, 5, 1, "#d47a35"); px(x + w - 5, y + h - 1, 5, 1, "#d47a35");
}
// Adi character sprites (Melayu-themed, with tengkolok and baju Melayu)
const adiSmallImg = new Image();
adiSmallImg.src = "assets/adi-small.png";
const adiBigImg = new Image();
adiBigImg.src = "assets/adi-big.png";
let adiSmallReady = false, adiBigReady = false;
adiSmallImg.onload = () => { adiSmallReady = true; };
adiBigImg.onload = () => { adiBigReady = true; };

function drawMario(x, y, w, h, facing, state, star, dead) {
  x = Math.round(x); y = Math.round(y);
  const useAdi = (state === 0 ? adiSmallReady : adiBigReady) ||
                 (state === 0 ? adiSmallImg : adiBigImg).complete;
  if (useAdi && !dead) {
    const img = state === 0 ? adiSmallImg : adiBigImg;
    const sw = img.naturalWidth || (state === 0 ? 18 : 24);
    const sh = img.naturalHeight || (state === 0 ? 32 : 56);
    // Scale sprite to match hitbox height (h), keeping aspect ratio
    const drawH = h + 4; // sprite slightly taller than hitbox for visibility
    const drawW = Math.round(drawH * sw / sh);
    const offsetX = (w - drawW) / 2;
    const drawX = x + offsetX;
    const drawY = y - 2; // anchor at top
    ctx.save();
    if (facing < 0) {
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, sw, sh, -(drawX + drawW), drawY, drawW, drawH);
    } else {
      ctx.drawImage(img, 0, 0, sw, sh, drawX, drawY, drawW, drawH);
    }
    if (star) {
      const tint = ["#ffe60044", "#ff3b3044", "#36d15c44", "#3b82f644"];
      ctx.fillStyle = tint[Math.floor(performance.now() / 90) % tint.length];
      if (facing < 0) {
        ctx.fillRect(-(drawX + drawW), drawY, drawW, drawH);
      } else {
        ctx.fillRect(drawX, drawY, drawW, drawH);
      }
    }
    ctx.restore();
    return;
  }
  // Fallback (before image loads OR dead): draw simple silhouette
  const gray = dead ? "#666" : (star ? "#ff0" : "#e3262e");
  ctx.fillStyle = gray;
  ctx.fillRect(x + 1, y, w - 2, 3);
  ctx.fillRect(x, y + 2, w, 2);
  ctx.fillStyle = state === 0 ? "#f5a15b" : "#ffd08b";
  ctx.fillRect(x + 2, y + 4, w - 4, h - 4);
  ctx.fillStyle = gray;
  ctx.fillRect(x, y + h - 3, w, 3);
  if (state > 0) {
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(x + 2, y + h - 6, w - 4, 2);
  }
}
function drawPowerItem(it) {
  const x = Math.round(it.x), y = Math.round(it.y), w = it.w, h = it.h;
  if (it.type === "M") {
    px(x + 1, y + 2, w - 2, h - 2, "#351812");
    px(x + 2, y + 1, w - 4, 7, "#e3262e");
    px(x + 3, y + 4, 3, 3, "#fff");
    px(x + w - 6, y + 4, 3, 3, "#fff");
    px(x + 3, y + 8, w - 6, h - 8, "#f5a15b");
  } else if (it.type === "F") {
    px(x + 5, y + 5, 2, h - 4, "#239447");
    px(x + 2, y + 2, 5, 6, "#ff5c87");
    px(x + 6, y + 1, 5, 6, "#ffe45c");
    px(x + 4, y + 5, 4, 4, "#fff");
  } else {
    px(x + 5, y, 3, h, "#fff");
    px(x + 1, y + 4, 11, 4, "#ffe600");
    px(x + 3, y + 2, 7, 8, "#ffe600");
    px(x + 2, y + 5, 9, 3, "#ff4d6d");
  }
}
function drawQuestionTile(x, y, used) {
  px(x, y, TILE_SIZE, TILE_SIZE, used ? "#8a5a2a" : "#fc9838");
  px(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2, used ? "#5e3a1a" : "#ffb35a");
  px(x + 2, y + 2, TILE_SIZE - 4, 2, used ? "#5e3a1a" : "#fff3b0");
  ctx.fillStyle = used ? "#3a2010" : "#fff3b0";
  ctx.font = "bold 11px monospace";
  ctx.textAlign = "center";
  ctx.fillText("?", x + 8, y + 12);
  ctx.textAlign = "left";
}
function drawBrickTile(x, y, topGround = false) {
  px(x, y, TILE_SIZE, TILE_SIZE, "#9f3218");
  px(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2, "#c84c24");
  px(x + 1, y + 1, TILE_SIZE - 2, 2, "#e06a32");
  ctx.strokeStyle = "#762313";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y + 8.5); ctx.lineTo(x + TILE_SIZE, y + 8.5);
  ctx.moveTo(x + 8.5, y); ctx.lineTo(x + 8.5, y + 8);
  ctx.moveTo(x + 4.5, y + 9); ctx.lineTo(x + 4.5, y + TILE_SIZE);
  ctx.stroke();
  if (topGround) px(x, y, TILE_SIZE, 2, "#6fbd35");
}
function drawPipeTile(x, y, col, row) {
  const above = row > 0 ? getTile(col, row - 1) : ".";
  const isHead = above !== "P";
  const left = isHead ? x - 2 : x + 2;
  const width = isHead ? TILE_SIZE + 4 : TILE_SIZE - 4;
  px(left, y, width, TILE_SIZE, "#075b20");
  px(left + 2, y, width - 4, TILE_SIZE, "#00a83b");
  px(left + 3, y, 3, TILE_SIZE, "#53d45a");
  px(left + width - 4, y, 2, TILE_SIZE, "#007126");
  if (isHead) {
    px(x - 3, y, TILE_SIZE + 6, 3, "#064b1b");
    px(x - 1, y + 1, TILE_SIZE + 2, 2, "#13c84d");
  }
}
function drawFlagTile(x, y, col, row) {
  px(x + 6, y, 3, TILE_SIZE, "#eee");
  const above = row > 0 ? getTile(col, row - 1) : ".";
  if (above !== "L") {
    px(x + 8, y + 1, 8, 5, "#e3262e");
    px(x + 8, y + 2, 6, 2, "#ffcf35");
  }
}
function drawCastle(x, y) {
  px(x, y, 40, 32, "#888");
  px(x + 2, y + 2, 36, 28, "#aaa");
  px(x + 4, y, 2, 6, "#666");
  px(x + 34, y, 2, 6, "#666");
  px(x + 16, y + 12, 8, 14, "#444");
  px(x + 12, y + 8, 2, 4, "#666");
  px(x + 26, y + 8, 2, 4, "#666");
}
// Static Kampung background image (houses, mountains, sunset, wooden floor).
// Loaded once, drawn each frame WITHOUT scrolling (per spec).
const kampungBg = new Image();
kampungBg.src = "assets/kampung-bg.jpg";
let kampungBgReady = false;
kampungBg.onload = () => { kampungBgReady = true; };

function drawBackground(parallax) {
  // Image takes full canvas (256×240) — stretched, not tiled, static.
  if (kampungBgReady) {
    ctx.drawImage(kampungBg, 0, 0, canvas.width, canvas.height);
  } else {
    // Placeholder gradient sky while image loads
    const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grd.addColorStop(0, "#ff9b6a");
    grd.addColorStop(0.5, "#f7c97a");
    grd.addColorStop(1, "#9b6b3f");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  // Subtle warm haze overlay so the image is not too loud behind gameplay
  ctx.fillStyle = "rgba(40, 20, 10, 0.10)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function renderLifeIcons() {
  const host = document.getElementById("ui-lives-icons");
  if (!host) return;
  const target = gameOver ? 0 : Math.max(0, lives);
  if (lifeIcons.length === target && lifeIcons.length > 0) return;
  host.innerHTML = "";
  lifeIcons.length = 0;
  for (let i = 0; i < target; i++) {
    const span = document.createElement("img");
    // Use the real Adi sprite (Small Adi) for the HUD lives icon
    span.src = "assets/adi-small.png";
    span.alt = "♥";
    // Aspect-preserved: width 18, height computed from natural size
    span.style.width = "18px";
    span.style.height = "32px";
    span.style.objectFit = "none";
    span.style.imageRendering = "pixelated";
    span.style.display = "inline-block";
    span.style.verticalAlign = "middle";
    span.style.marginRight = "2px";
    host.appendChild(span);
    lifeIcons.push(span);
  }
}

// ------------------------------------------------------------
//  Draw loop
// ------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const parallax = Math.floor(cameraX * 0.18);
  drawBackground(parallax);

  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  for (let r = 0; r < mapHeight; r++) {
    for (let c = 0; c < mapWidth; c++) {
      const t = rawMap[r][c];
      const tileX = c * TILE_SIZE;
      const tileY = r * TILE_SIZE;
      // Bump animation offset
      let bumpY = 0;
      const bump = hitBumpTiles.find(b => b.tx === c && b.ty === r);
      if (bump) bumpY = -Math.round((bump.life / 6) * 4);

      if (t === "#" || t === "B") {
        drawBrickTile(tileX, tileY + bumpY, r === 13);
      } else if (t === "?") {
        drawQuestionTile(tileX, tileY + bumpY, false);
      } else if (t === "P") {
        drawPipeTile(tileX, tileY, c, r);
      } else if (t === "L") {
        drawFlagTile(tileX, tileY, c, r);
      } else if (t === "F" || t === "M" || t === "S") {
        // shouldn't appear in static map (only as items), but render anyway
        ctx.fillStyle = "#888"; ctx.fillRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Castle at end of map
  if (mapWidth > 6) drawCastle((mapWidth - 6) * TILE_SIZE, (STAGE_ROWS - 4) * TILE_SIZE);

  items.forEach(it => drawPowerItem(it));

  ctx.fillStyle = "#f83800";
  fireballs.forEach(fb => {
    px(fb.x, fb.y, fb.w, fb.h, "#f83800");
    px(fb.x + 1, fb.y + 1, fb.w - 2, fb.h - 2, "#ffd166");
  });

  enemies.forEach(e => { if (e.alive) drawGoomba(e.x, e.y, e.w, e.h, e.vx < 0); });

  particles.forEach(p => px(p.x, p.y, p.w, p.h, p.color));

  if (mario.invulnerableTimer % 4 < 2 || mario.invulnerableTimer === 0) {
    drawMario(mario.x, mario.y, mario.w, mario.h, mario.facing, mario.state, mario.starTimer > 0, mario.dead);
  }

  ctx.restore();

  // Stage name banner at top
  if (stageClearTimer > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 100, 256, 40);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 8px monospace";
    ctx.textAlign = "center";
    ctx.fillText("STAGE " + (stageIndex + 1) + " - " + STAGES[stageIndex].name, 128, 116);
    ctx.fillStyle = "#fff";
    ctx.font = "6px monospace";
    ctx.fillText(STAGES[stageIndex].sub, 128, 130);
    ctx.textAlign = "left";
  }

  // Death flash before reset
  if (mario.dead && !gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, 256, 240);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px monospace";
    ctx.textAlign = "center";
    ctx.fillText("REBOH!", 128, 130);
    ctx.textAlign = "left";
  }

  // Game over screen
  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, 256, 240);
    ctx.fillStyle = "#d62828";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 128, 100);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("SKOR: " + String(score).padStart(6, "0"), 128, 122);
    ctx.fillStyle = "#fff";
    ctx.font = "7px monospace";
    ctx.fillText("TEKAN R UNTUK MULA BARU", 128, 144);
    ctx.textAlign = "left";
    if (gameOverT === undefined) gameOverT = 0;
    gameOverT++;
    if (gameOverT === 60) SND.gameOver();
  } else { gameOverT = 0; }

  if (win) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, 256, 240);
    ctx.fillStyle = "#fcfc00";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText("TAHNIAH!", 128, 96);
    ctx.fillStyle = "#fff";
    ctx.font = "8px monospace";
    ctx.fillText("Abe Yo tamat semua stage!", 128, 118);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("SKOR AKHIR: " + String(score).padStart(6, "0"), 128, 140);
    ctx.fillStyle = "#fff";
    ctx.font = "7px monospace";
    ctx.fillText("TEKAN R UNTUK MULA BARU", 128, 160);
    ctx.textAlign = "left";
  }

  // Title screen
  if (titleState) drawTitle();
}

let gameOverT = 0;

function drawTitle() {
  // Use the static Kampung background on the title screen too
  if (kampungBgReady) {
    ctx.drawImage(kampungBg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#5c94fc";
    ctx.fillRect(0, 0, 256, 240);
  }
  // Subtle dark overlay so the title is readable on top of the bg
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, 256, 240);
  // Decorative wooden plank strip at bottom
  ctx.fillStyle = "#7a4b32";
  ctx.fillRect(0, 200, 256, 40);
  ctx.fillStyle = "#9b5a3a";
  for (let p = 0; p < 256; p += 16) ctx.fillRect(p, 200, 1, 40);
  // Title text
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold 12px monospace";
  ctx.textAlign = "center";
  ctx.fillText("SUPER MARIO", 128, 48);
  ctx.fillText("EVOLUTION 2", 128, 64);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 8px monospace";
  ctx.fillText("EDISI KELANTAN", 128, 82);
  // Decorative Adi silhouettes (using real sprites, aspect-preserved)
  if (adiSmallReady) {
    const sw = adiSmallImg.naturalWidth || 18, sh = adiSmallImg.naturalHeight || 32;
    const drawW = 22, drawH = Math.round(drawW * sh / sw);
    ctx.drawImage(adiSmallImg, 102, 110 - drawH, drawW, drawH);
  }
  if (adiBigReady) {
    const sw = adiBigImg.naturalWidth || 24, sh = adiBigImg.naturalHeight || 56;
    const drawH = 60, drawW = Math.round(drawH * sw / sh);
    ctx.drawImage(adiBigImg, 132 - drawW / 2, 130 - drawH, drawW, drawH);
  }
  // Press start
  const blink = Math.floor(performance.now() / 500) % 2 === 0;
  if (blink) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px monospace";
    ctx.fillText("TEKAN ENTER UNTUK MULA", 128, 168);
  }
  ctx.fillStyle = "#ffd166";
  ctx.font = "6px monospace";
  ctx.fillText("A/D atau PANAH  - GERAK", 128, 218);
  ctx.fillText("SPACE     - LOMPAT", 128, 226);
  ctx.fillText("SHIFT     - PANCAI", 128, 234);
  ctx.textAlign = "left";
}

// ------------------------------------------------------------
//  Boot
// ------------------------------------------------------------
rebuildMap(0);
spawnEnemiesForStage(0);
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
